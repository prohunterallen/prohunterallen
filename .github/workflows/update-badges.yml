name: Update Badges
on:
  workflow_dispatch:
jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Badges - Readme Action
        uses: hendra-h/badges-readme@v1
        with:
          CREDLY_USER: mr-akarat-gobkuea
          BADGES_PER_LINE: 5
